source = $HOME/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# GENERAL
general {
    # disable_loading_bar = true
    hide_cursor = true
    enable_fingerprin
    text_trim=true
}

# BACKGROUND
background {
    monitor =
    path = ~/.config/backgrounds/1350128.png
    blur_passes = 2
    color = $base
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $text
    font_size = 25
    font_family = $font
    position = 0, 50 
    halign = center
    valign = center
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 16
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}

# PLAYER IMAGE
image {
    monitor = 
    path =
    size = 100 
    rounding = 10 
    border_size = 0
    rotate = 0 
    reload_time = 1
    reload_cmd = /home/alessio/.local/lib/hyprlock/sopify_widget.sh
    position = 0, 0
    rounding=20
    halign = center
    valign = bottom 
    position= 0, 200
    opacity=0.5
    zindex=1
}


# PLAYER ICON
label {
    monitor = 
    text = cmd[update:1000] ~/.local/lib/hyprlock/spotify_widget_data.sh icon 
    color = $text
    font_size = 20
    position = 0, 160
    halign = center
    valign = bottom
    zindex=1
}

# PLAYER TITLE
label {
    monitor = 
    text = cmd[update:1000] ~/.local/lib/hyprlock/spotify_widget_data.sh title
    font_size = 16
    zindex=1
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, 130
    halign = center
    align=center
    valign = bottom
}

# PLAYER ALBUM
label {
    monitor = 
    text = cmd[update:1000] ~/.local/lib/hyprlock/spotify_widget_data.sh album
    color = $text
    font_size = 14
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, 100
    zindex=1
    halign = center
    valign = bottom
    align=center
}

# PLAYER ARTIST
label {
    monitor = 
    text = cmd[update:1000] ~/.local/lib/hyprlock/spotify_widget_data.sh artist
    color = $text
    font_size = 13
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, 80
    zindex=1
    halign = center
    valign = bottom
    align=center

}

# Utils
label {
    monitor = 
    text = cmd[update:1000] ~/.local/lib/hyprlock/hyprlock_utils.sh
    font_size = 12
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    halign = center
    align=center
    valign = center
    position = 0, -7
}

#
# INPUT FIELD
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
    hide_input = false
    check_color = $yellow
    outer_color = $accent
    fail_color = $accent
    capslock_color = $yellow
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -60
    halign = center
    valign = center
}
