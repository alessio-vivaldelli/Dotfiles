"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
$git_branch\
$git_state\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$time\
$fill\
$git_metrics\
$cmd_duration\
$line_break$character"""


palette = 'catppuccin_mocha'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
orange = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = false
style_user = "fg:text"
style_root = "fg:text"
format = '[ $user ]($style)'

[directory]
style = "bold fg:blue "
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = ""
format = '[[ $symbol $branch ](fg:green )]($style)'

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "fg:yellow"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "fg:text"

[git_metrics]
disabled = false
added_style = 'bold fg:blue'
format = '([+$added]($added_style) [-$deleted]($deleted_style)) '

[nodejs]
symbol = ""
style = ""
format = '[[ $symbol( $version) ](fg:green )]($style)'

[c]
symbol = " "
style = ""
format = '[[ $symbol( $version) ](fg:green )]($style)'

[rust]
symbol = ""
style = ""
format = '[[ $symbol( $version) ](fg:green )]($style)'

[golang]
symbol = ""
style = ""
format = '[[ $symbol( $version) ](fg:green )]($style)'

[php]
symbol = ""
style = ""
format = '[[ $symbol( $version) ](fg:green )]($style)'

[java]
symbol = " "
style = ""
format = '[[ $symbol( $version) ](fg:green )]($style)'

[kotlin]
symbol = ""
style = ""
format = '[[ $symbol( $version) ](fg:green )]($style)'

[haskell]
symbol = ""
style = ""
format = '[[ $symbol( $version) ](fg:green )]($style)'

[python]
symbol = ""
style = ""
format = '[[ $symbol( $version) ](fg:green )]($style)'

[docker_context]
symbol = ""
style = ""
format = '[[ $symbol( $context) ](fg:#83a598 )]($style)'

[time]
disabled = false
time_format = "%R"
style = ""
format = '[[  $time ](fg:blue )]($style)'

[line_break]
disabled = false

[cmd_duration]
min_time = 50
format = ' [$duration](bold yellow) '
show_milliseconds = true
min_time_to_notify = 1500
show_notifications = true

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:creen)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:lavender)'
